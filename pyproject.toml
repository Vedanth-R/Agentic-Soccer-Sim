[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchlab"
version = "0.1.0"
description = "A small, deterministic 2D soccer simulation for learning and tactical experiments."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pygame>=2.5", "torch>=2.0"]
